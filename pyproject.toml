[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-categorizing"
version = "0.1.0"
description = "OpenAI-compatible LLM job categorization pipeline for employee self reviews."
requires-python = ">=3.11,<3.12"
dependencies = [
  "openai>=1.40.0",
  "pandas>=2.0.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.0",
  "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
